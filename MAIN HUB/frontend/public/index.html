<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="RS Hub - Business Management Platform" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>RS Hub</title>
    <!-- Dynamic title will be updated by JavaScript -->
    <script>
      // Function to update title and favicon from localStorage
      function updateSiteSettings() {
        // Update title
        const platformName = localStorage.getItem('platformName') || 'RS Hub';
        document.title = platformName;
        
        // Update favicon
        const systemLogo = localStorage.getItem('systemLogo');
        if (systemLogo) {
          const link = document.querySelector("link[rel*='icon']") || document.createElement('link');
          link.type = 'image/x-icon';
          link.rel = 'shortcut icon';
          link.href = systemLogo;
          document.getElementsByTagName('head')[0].appendChild(link);
        }
      }
      
      // Run on page load
      updateSiteSettings();
      
      // Listen for storage changes (when settings are updated in another tab)
      window.addEventListener('storage', function(e) {
        if (e.key === 'platformName' || e.key === 'systemLogo') {
          updateSiteSettings();
        }
      });
      
      // Listen for custom event (when settings are updated in the same tab)
      window.addEventListener('settingsUpdated', function(e) {
        if (e.detail) {
          if (e.detail.platformName) {
            document.title = e.detail.platformName;
          }
          if (e.detail.logo) {
            const link = document.querySelector("link[rel*='icon']") || document.createElement('link');
            link.type = 'image/x-icon';
            link.rel = 'shortcut icon';
            link.href = e.detail.logo;
            document.getElementsByTagName('head')[0].appendChild(link);
          }
        }
      });
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
